name: Build notarized DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: App version (for example, 0.1.1)
        required: true
        default: '0.1.1'
        type: string

permissions:
  contents: read

jobs:
  notarize:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NOTARY_KEYCHAIN_PROFILE: walldance-notary

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set app version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/walldance-signing.keychain-db" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$RUNNER_TEMP/walldance-signing.keychain-db" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must have the form 1.2.3 (tags: v1.2.3)' >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Validate release notes
        run: bash scripts/release-notes.sh "$APP_VERSION" > /dev/null

      - name: Validate update signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Missing repository secret: SPARKLE_PRIVATE_KEY' >&2
            exit 1
          fi

      - name: Run tests
        run: |
          xcodebuild -version
          swift test

      - name: Import signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          certificate="$RUNNER_TEMP/walldance-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"

          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$certificate" -k "$SIGNING_KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$SIGNING_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          # Select the imported Developer ID Application identity for this team.
          identities="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          signing_identity="$(printf '%s\n' "$identities" | awk -v team="$APPLE_TEAM_ID" \
            '/"Developer ID Application: / && index($0, "(" team ")\"") { print $2 }')"
          if [[ ! "$signing_identity" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo 'Expected exactly one valid Developer ID Application identity for APPLE_TEAM_ID in MACOS_CERTIFICATE_P12' >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$NOTARY_KEYCHAIN"

      - name: Build and sign universal app
        env:
          UNIVERSAL_BUILD: '1'
        run: zsh scripts/build-app.sh

      - name: Build signed DMG
        run: zsh scripts/build-dmg.sh --skip-build

      - name: Notarize and staple DMG
        run: zsh scripts/notarize-app.sh "dist/Walldance-$APP_VERSION.dmg"

      - name: Generate and verify signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: zsh scripts/generate-appcast.sh "dist/Walldance-$APP_VERSION.dmg"

      - name: Upload notarized DMG and update feed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Walldance-${{ env.APP_VERSION }}-universal
          path: |
            dist/Walldance-${{ env.APP_VERSION }}.dmg
            dist/appcast.xml
          if-no-files-found: error
          compression-level: 0

      - name: Upload notarization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-diagnostics
          path: dist/notarization-*.json
          if-no-files-found: ignore

      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          if [[ -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/walldance-certificate.p12"

  release:
    needs: notarize
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare release notes and download notarized DMG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-notes.sh "$version" > "$RUNNER_TEMP/release-notes.md"
          gh run download "$GITHUB_RUN_ID" \
            --name "Walldance-$version-universal" --dir dist
          test -f "dist/Walldance-$version.dmg"
          test -f dist/appcast.xml

      - name: Create or update draft release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" != true ]]; then
              echo 'Refusing to replace a published update. Create a new version tag instead.' >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --draft --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" "dist/Walldance-$version.dmg" dist/appcast.xml --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/Walldance-$version.dmg" dist/appcast.xml \
              --draft --verify-tag --title "Walldance $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
